name: Publish to PyPI

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.13.6
      - name: Check tag against package version
        run: python -c 'import os, tomllib; assert "v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == os.environ["GITHUB_REF_NAME"]'
      - run: uv sync --locked
      - run: uv run --frozen pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
