name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --python "${{ matrix.python }}"
      - run: uv run --frozen pytest -q
      - run: uv build
      - name: Install AWS Emulator
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/aws-emulator_1.0.385-1_amd64.deb \
            --output "$RUNNER_TEMP/aws-emulator.deb"
          sudo dpkg -i "$RUNNER_TEMP/aws-emulator.deb"
      - name: Run emulator integration tests
        run: |
          aws-emulator --telemetry off > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 --cacert "$HOME/.aws/emulator/9297/ca.pem" \
                https://127.0.0.1:9297/__admin/health > /dev/null 2>&1; then
              uv run --frozen pytest -q integration/test_emulator.py
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
